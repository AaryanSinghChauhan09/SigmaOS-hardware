[package]
name = "sigmaos-hardware"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Hardware abstraction and device management"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-hardware"
readme = "README.md"
keywords = ["hardware", "device", "abstraction"]
categories = ["hardware-support"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
